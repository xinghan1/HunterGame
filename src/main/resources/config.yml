# 配置大厅世界和坐标
lobby:
  world: normal
  x: 0
  y: 100.0
  z: 0

# 数据库信息
database:
  type: "mysql" # 可选值：mysql（数据库）、file（本地文件）
  host: "localhost"       # 数据库地址
  port: 3306              # 端口
  name: "huntergame1"       # 数据库名
  username: "huntergame1"        # 数据库用户名
  password: "88brSyM4Kff4r5zX"            # 数据库密码
  timezone: "Asia/Shanghai" # 时区
  use_ssl: false          # 是否启用 SSL
  table_prefix: "hg_"        # 数据库表前缀

game:
  reset_worlds_on_shutdown: true  # 关服时是否自动删除世界文件夹重置地图
  minPlayers: 3        # 最小玩家人数
  countdown: 60        # 倒计时总时间（秒）
  end_delay: 15        # 关闭服务器倒计时
  countdownKeyTimes:   # 自定义关键倒计时时间点
    - 60
    - 50
    - 40
    - 30
    - 20
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1
  escapers_quit_countdown: 120  # 所有逃生者已退出，开始结束倒计时
  hunter_max_health: 20  # 设置 猎人 最大血量
  escaper_max_health: 24  # 设置 逃生者 最大血量
  escapers_removeCage: 15  # 游戏开始后，逃生者延迟移除屏障时间
  hunter_removeCage: 25  # 游戏开始后，猎人延迟移除屏障时间
  kickTime: 10 # 无操作踢出时间（分钟）
  compass:  # 是否启用指南针gui
    enable: true
    hunter_tp_compass_cooldown: 300  # 猎人指南针传送 打开冷却（300秒）
    deduct_health: 18  # 猎人传送扣除血量
    detection_distance: 50  # 猎人传送时 检测附近50格内是否有逃生者，如果有不进行传送
  game_time_limit_minutes: 30  # 游戏超过30分钟无法中途加入
  escaper_ratio_threshold: 3.0  # 猎人:逃生者比例
  hunter_shared_backpack: 90  # 猎人共享背包冷却（秒）
  escaper_shared_backpack: 90  # 逃生者共享背包冷却（秒）
  escaper_tracking_enable: true  # 是否启用逃生者队伍跟踪
  hunter_respawn_radius: 200  # 猎人复活配置,复活到逃生者附近的随机半径（格）
  spectator_max_distance: 100 # 旁观者距离观看目标的最大距离（格），超出自动传送回去
  respawn:
    baseRespawnTime: 5  # 最小复活时间(秒)
    maxRespawnTime: 180 # 最大复活时间(秒)
    maxGameTime: 3000 # 最大推移时间(秒)  随着游戏时间增加，复活时间而延长
  persistence_modes:   # 生存战各模式获胜所需存活时间（分钟）
    skill_battle_minutes: 20
    final_battle_minutes: 10
    vanilla_hunter_minutes: 25

ore_multiplier:
  player_radius_chunks: 1      # 玩家跨区块时，处理周围多少圈已加载区块
  max_chunks_per_tick: 1       # 每 tick 最多处理几个区块，调高会更快但更吃性能
  veins_per_chunk: 18          # 每个区块额外尝试生成的矿脉数，想更夸张可调到 24
  visible_vein_chance: 0.35    # 有多少矿脉优先贴近洞穴表面，方便玩家直接看见

mode-selection:
  toggle:
    fixed-mode-enabled: true  # 开启固定模式
    fixed-mode-id: 2          # 固定为“技能之战”（1=技能，2=终章，3=原版）

BungeeCord:
  enable: false # 是否启用跨服传送功能
  server_lobby: lobby_1  # 大厅服务器名称
  server_selector: # 跨服传送物品
    material: "ENDER_EYE"
    slot: 8
    display_name: "§c§l离开游戏"
    lore:
      - "§7右键传送到大厅"

# 按总人数配置阵营 (技能之战/原版猎人使用)
player_counts:
  scaling:
    thresholds:
      15: 5  # 15人以上 -> 5 逃生者
      10: 4  # 10-15人 -> 4 逃生者
      8: 3  # 8-12人 -> 3 逃生者
      5: 2   # 5-8人 -> 2 逃生者
    default: 1 # 5人以下 -> 1 逃生者
  final_battle:
    scaling:
      thresholds:
        12: 3  # 12人及以上 -> 3 逃生者
        7: 2   # 7-11人 -> 2 逃生者
      default: 1 # 7人以下

# 猎人重生补给配置（支持多时间段，游戏时间越长装备越好）
hunter_resupply:
  enable: true
  time_stages:
    # 第一阶段：游戏开始 10-30 分钟
    - name: "初期装备"
      min_minutes: 10
      items:
        - material: LEATHER_HELMET
          amount: 1
          slot: helmet
        - material: LEATHER_CHESTPLATE
          amount: 1
          slot: chestplate
        - material: LEATHER_LEGGINGS
          amount: 1
          slot: leggings
        - material: LEATHER_BOOTS
          amount: 1
          slot: boots
        - material: STONE_SWORD
          amount: 1
          slot: 0
        - material: STONE_AXE
          amount: 1
          slot: 1
        - material: STONE_PICKAXE
          amount: 1
          slot: 2
    # 第二阶段：游戏 30-60 分钟
    - name: "中期装备"
      min_minutes: 30
      items:
        - material: IRON_HELMET
          amount: 1
          slot: helmet
        - material: IRON_CHESTPLATE
          amount: 1
          slot: chestplate
        - material: IRON_LEGGINGS
          amount: 1
          slot: leggings
        - material: IRON_BOOTS
          amount: 1
          slot: boots
        - material: IRON_SWORD
          amount: 1
          slot: 0
        - material: IRON_AXE
          amount: 1
          slot: 1
        - material: IRON_PICKAXE
          amount: 1
          slot: 2
    # 第三阶段：游戏 60 分钟以上
    - name: "后期装备"
      min_minutes: 60
      items:
        - material: DIAMOND_HELMET
          amount: 1
          slot: helmet
        - material: DIAMOND_CHESTPLATE
          amount: 1
          slot: chestplate
        - material: DIAMOND_LEGGINGS
          amount: 1
          slot: leggings
        - material: DIAMOND_BOOTS
          amount: 1
          slot: boots
        - material: DIAMOND_SWORD
          amount: 1
          slot: 0
        - material: DIAMOND_AXE
          amount: 1
          slot: 1
        - material: DIAMOND_PICKAXE
          amount: 1
          slot: 2
        - material: BOW
          amount: 1
          slot: 3
        - material: ARROW
          amount: 10
          slot: 9

# 聊天格式
formats:
  enable: true
  admin:
    permission: chatformat.admin
    format: "&7[%huntergame_proficiency%★]%huntergame_role% &c&l%player% -> &c%message%"
  mvp:
    permission: chatformat.mvp
    format: "&7[%huntergame_proficiency%★]%huntergame_role% &6&l%player% -> &6%message%"
  vip:
    permission: chatformat.vip
    format: "&7[%huntergame_proficiency%★]%huntergame_role% &b&l%player% -> &b%message%"
  default:
    permission: null
    format: "&7[%huntergame_proficiency%★]%huntergame_role% &f&l%player% -> &f%message%"


# 定时广播配置
broadcast:
  enable: true                # 是否启用广播
  interval: 240               # 消息间隔（秒）
  messages:
    - "§a小贴士: §c如果你不小心掉线了，可在3分钟内重新连接，回到原来的状态！"
    - "§a小贴士: §c猎人游戏有三大模式: 原版猎人，技能之战，终章之战。"
    - "§a小贴士: §c原版猎人限时5小时，技能之战限时2小时，终章之战限时30分钟。"
    - "§a小贴士: §c本猎人游戏有多个末地传送门哦！末影珍珠只会跟随最近的末地传送门！"

# 游戏奖励指令配置
rewards:
  # 猎人击杀后奖励
  hunter_kill:
    - "points give %player% 10"
    - "money give %player% 20"
  # 逃生者击杀猎人后的奖励
  escaper_kill:
    - "points give %player% 5"
    - "money give %player% 10"
  # 猎人胜利奖励
  hunter_reward:
    - "points give %player% 50"
    - "money give %player% 150"
  # 猎人失败奖励
  hunter_fail_reward:
    - "points give %player% 20"
    - "money give %player% 50"
  # 猎人在终章胜利奖励
  hunter_final_reward:
    - "points give %player% 20"
    - "money give %player% 50"
  # 猎人在终章失败奖励
  hunter_final_fail_reward:
    - "points give %player% 10"
    - "money give %player% 30"
  # 逃生者胜利奖励
  escaper_reward:
    - "points give %player% 100"
    - "money give %player% 300"
  # 逃生者失败奖励
  escaper_fail_reward:
    - "points give %player% 30"
    - "money give %player% 100"
  # 逃生者在终章胜利奖励
  escaper_final_reward:
    - "points give %player% 50"
    - "money give %player% 150"
  # 逃生者在终章失败奖励
  escaper_final_fail_reward:
    - "points give %player% 10"
    - "money give %player% 50"
# 定时奖励配置
timed_rewards:
  enabled: true # 是否启用定时奖励
  interval: 60 # 奖励间隔，单位为秒
  reward_commands:
    - "points give %player% 5"
    - "money give %player% 10"
  reward_message: "&e你收到了定时奖励！"  # 定时奖励消息


scoreboard:
  enabled: true # 是否启用计分板
  waiting: # 等待中的计分板
    title: "&6猎人游戏"
    lines:
      - "&1"
      - '&f赛季: %huntergame_season%'
      - '&f模式: %huntergame_mode%'
      - "&2"
      - "&f总杀敌: %huntergame_kills_put%"
      - "&f游戏次数: %huntergame_games_played%"
      - "&f胜利次数: %huntergame_total_wins%"
      - "&f熟练度: %huntergame_proficiency%"
      - "&3"
      - "&b状态: &a等待中"
      - "&f玩家数量: &a%players%/&c32"
      - "&4"
      - "&bplay.tiancraft.cn"
  game: # 游戏中的计分板（技能之战）
    title: "&6猎人游戏"
    lines:
      - "&1"
      - "&f角色: %huntergame_role%"
      - "&f模式: %huntergame_mode%"
      - '&f游戏时间: &a%huntergame_gametime%'
      - "&2"
      - "&f下界堡垒: %huntergame_fortress%"
      - "&f猪灵堡垒: %huntergame_bastion%"
      - "&f末地要塞: %huntergame_portal%"
      - "&3"
      - "&f猎人|逃生者: &c%huntergame_hunter_count%/&b%huntergame_escaper_count%"
      - "&f击杀: %huntergame_kills%"
      - "&4"
      - "&bplay.tiancraft.cn"
  final_battle:  # 终章之战和原版猎人 显示的计分板
    title: "&6猎人游戏"
    lines:
      - "&1"
      - "&f角色: %huntergame_role%"
      - "&f模式: %huntergame_mode%"
      - '&f游戏时间: &a%huntergame_gametime%'
      - "&3"
      - "&f猎人|逃生者: &c%huntergame_hunter_count%/&b%huntergame_escaper_count%"
      - "&f击杀: %huntergame_kills%"
      - "&4"
      - "&bplay.tiancraft.cn"


