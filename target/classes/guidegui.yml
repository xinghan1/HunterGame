# 玩法介绍GUI配置文件
# GUI基础设置
gui:
  title: "&6玩法介绍"  # GUI标题
  size: 27             # 格数（必须是9的倍数：9/18/27/36/45/54）

# 触发物品设置（右键/左键打开GUI的物品）
trigger-item:
  material: "BOOK"       # 物品材质
  name: "&a玩法指南"      # 物品名称
  lore:                  # 物品描述
    - "&7右键点击打开玩法介绍"
    - "&7查看游戏规则和技巧"
  trigger-action: "BOTH"  # 触发动作：RIGHT_CLICK/LEFT_CLICK/BOTH
  forced-slot: 0  # 放在快捷栏第1格

# GUI内展示的物品（玩法介绍内容）
items:
  0:
    slot: 10           # 槽位
    material: "BOOK"  # 物品材质
    name: "&a数据修改"  # 物品名称
    lore:              # 描述内容
      - ''
      - '&72. 猪灵交易仅可以获得黑曜石，抗火药水和末影珍珠'
      - '&73. 击杀凋零骷髅 50% 掉落头颅'
      - '&74. 击杀烈焰人 100% 掉落烈焰棒'
      - '&75. 击杀末影人 100% 掉落末影珍珠'
    click-action: "none"  # 点击动作（预留：none/open-submenu等）

  1:  # 第二个物品
    slot: 11
    material: "DRAGON_EGG"
    name: "&a获胜条件"
    lore:
      - ''
      - '&7方式1 逃生者全部死亡，猎人获胜'
      - '&7方式2 末影龙死亡，逃生者获胜'
      - '&7方式3 游戏限时2小时，超过2小时猎人获胜'
      - '&7原版猎人限时4小时，终章之战限时30分钟'
    click-action: "none"

  2:  # 第三个物品
    slot: 12
    material: "BOW"
    name: "&a规则"
    lore:
      - ''
      - '&7游戏开始时选择职业技能，两队伍相隔100-150米'
      - '&7逃生者拥有额外最大生命4'
      - '&7逃生者提早放出15秒，稍后猎人放出'
      - '&7游戏超过40分钟，重生猎人将获得铁全套'
      - '&7猎人死亡后有复活时间，其时间随着游戏时长增加而增加啊'
    click-action: "none"

  3:
    slot: 13
    material: "CHEST"
    name: "&a共享背包"
    lore:
      - ''
      - '&7猎人和逃生者都有一个独立的共享背包'
      - '&7共享背包可以加强队友的配合'
      - '&7每次打开共享背包将会进入冷却期'
    click-action: "none"

  4:
    slot: 14
    material: "COMPASS"
    name: "&a传送"
    lore:
      - ''
      - '&7猎人队伍右键指南针，可自由选择队友进行传送'
      - '&7消耗19血量进行传送'
      - '&7每次传送，都要经过3分钟的冷却'
      - '&7附近50格内有逃生者将无法传送！'
    click-action: "none"

  5:
    slot: 15
    material: "LIME_WOOL"
    name: "&a掉线保护"
    lore:
      - ''
      - '&7若你发生了掉线情况'
      - '&7不要慌张！我服做了一个掉线保护！'
      - '&7请在2分钟内重新连接服务器！'
      - '&7就可以恢复原来状态！'
    click-action: "none"