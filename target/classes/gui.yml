# 中途加入 角色选择 gui 配置
join_midway_role-gui:
  title: 选择你的角色
  hunter:
    slot: 3
    material: IRON_SWORD
    name: '&c猎人'
    lore:
    - '&7选择成为猎人。'
  escaper:
    slot: 4
    material: EMERALD
    name: '&a逃生者'
    lore:
    - '&7选择成为逃生者。'
  spectator:
    slot: 5
    material: FEATHER
    name: '&7旁观者'
    lore:
    - '&7选择成为旁观者。'

# 投票系统配置
vote-gui:
  title: '&6模式与角色选择'
  size: 27 # GUI尺寸
  messages:
    no-mode-selected: '&e请先选择游戏模式再选阵营！'
  lore:
    current-selection: '&7当前选择: %count%'
  type-section: # 战役类型选择区 (生存战/通关战)
    slot: 3 # 基础槽位
    items:
      '0':
        id: 1
        material: CLOCK
        name: '&e生存战'
        lore:
        - '&7逃生者存活指定时间即获胜'
        - '&7或击杀末影龙(终章除外)'
        sound: UI_BUTTON_CLICK
        pitch: 1.0
      '1':
        id: 2
        material: DIAMOND_SWORD
        name: '&a通关战'
        lore:
        - '&7逃生者击杀末影龙获胜'
        - '&7猎人时间耗尽获胜'
        sound: UI_BUTTON_CLICK
        pitch: 1.0
  mode-section: # 游戏模式选择区配置
    slot: 12
    items:
      # 技能之战
      '0':
        id: 1
        material: NETHER_STAR
        name: '&b技能之战'
        lore:
        - '&7经典模式 | 猎人可复活'
        - '&7逃生者：击杀末影龙获胜'
        - '&7猎人：淘汰所有逃生者'
        # 播放的音效
        sound: ENTITY_EXPERIENCE_ORB_PICKUP
        # 音效音调
        pitch: 1.2
      '1':
        id: 3
        material: IRON_INGOT
        name: '&7原版猎人'
        lore:
        - '&7无技能模式 | 纯原版机制'
        - '&7逃生者：击败末影龙获胜'
        - '&7猎人：淘汰所有逃生者'
        sound: ENTITY_EXPERIENCE_ORB_PICKUP
        pitch: 1.0
      '2':
        id: 2
        material: DRAGON_EGG
        name: '&c终章之战'
        lore:
        - '&7末地战场 | 全体不可复活'
        - '&71名逃生者 vs 全体猎人'
        - '&7逃生者：击败末影龙；猎人：淘汰所有逃生者'
        sound: ENTITY_EXPERIENCE_ORB_PICKUP
        pitch: 0.8
  role-section: # 阵营选择区配置
    slot: 21
    items:
      '0':
        id: 1
        material: EMERALD
        name: '&a逃生者角色'
        lore:
        - '&7选择后成为逃生者的概率提升'
        sound: BLOCK_NOTE_BLOCK_PLING
        pitch: 1.0
      '1':
        id: 2
        material: REDSTONE
        name: '&c猎人角色'
        lore:
        - '&7选择后成为猎人的概率提升'
        sound: BLOCK_NOTE_BLOCK_PLING
        pitch: 0.8
  divider: # GUI空白格子装饰
    material: GRAY_STAINED_GLASS_PANE
    name: ' '

# 投票物品配置
vote-item:
  material: NAME_TAG
  name: '&6投票选择'
  slot: 1
  lore:
  - '&7右键点击打开模式与阵营选择界面'
  - '&7投票截止后将自动分配角色'
